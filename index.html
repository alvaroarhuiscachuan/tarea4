<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN de FontAwesome para los Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h2><i class="fa-solid fa-blog"></i> Mi Blog</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- Botón de Modo Oscuro -->
                <button id="btnDarkMode" title="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <!-- Botón Cerrar Sesión con icono -->
                <button id="btnCerrarSesion">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </header>
        
        <main>
            <div style="margin-bottom: 30px;">
                <h3><i class="fa-solid fa-pen"></i> Nueva Publicación</h3>
                <form id="formPost">
                    <input type="text" id="tituloPost" placeholder="Título de la publicación..." required>
                    <textarea id="contenidoPost" placeholder="¿Qué estás pensando hoy?..." rows="4" required></textarea>
                    <button type="submit" id="btnPublicar">
                        <i class="fa-solid fa-paper-plane"></i> Publicar
                    </button>
                </form>
            </div>

            <h3><i class="fa-solid fa-list"></i> Mis Publicaciones</h3>
            <div id="listaPublicaciones">
                <!-- Los posts se inyectarán aquí -->
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script src="blog.js"></script>
</body>
</html>
